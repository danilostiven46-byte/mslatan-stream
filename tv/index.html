<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TopStreaming TV</title>

<link rel="icon" href="/assets/faviconTop.png">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter, Arial, sans-serif;
}

body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
  color:white;
}

.tvScreen{
  width:100vw;
  height:100vh;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.logo{
  position:absolute;
  top:28px;
  left:50%;
  transform:translateX(-50%);
  height:70px;
  z-index:5;
}

video{
  width:100vw;
  height:100vh;
  background:#000;
  object-fit:contain;
}

.startBox{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#000;
  z-index:10;
  text-align:center;
  padding:30px;
}

.startBox h1{
  font-size:42px;
  margin-bottom:16px;
}

.startBox p{
  color:#cbd5e1;
  font-size:20px;
  margin-bottom:30px;
}

.startBtn{
  border:none;
  border-radius:18px;
  padding:18px 34px;
  font-size:22px;
  font-weight:700;
  color:white;
  cursor:pointer;
  background:linear-gradient(135deg,#ef4444,#991b1b);
  box-shadow:0 0 30px rgba(239,68,68,.35);
}

.errorMsg{
  margin-top:22px;
  color:#fca5a5;
  font-size:17px;
}
</style>
</head>

<body>

<div class="tvScreen">
  <img src="/assets/LogoTop.png" class="logo">

  <video id="video" controls></video>

  <div class="startBox" id="startBox">
    <h1>TopStreaming TV</h1>
    <p>Presiona iniciar para ver la transmisión en tu televisor.</p>
    <button class="startBtn" id="startBtn">▶ Iniciar transmisión</button>
    <div class="errorMsg" id="errorMsg"></div>
  </div>
</div>

<script>
const STREAM = "https://stream.mslatan.xyz/hls/stream.m3u8";
const video = document.getElementById("video");
const startBtn = document.getElementById("startBtn");
const startBox = document.getElementById("startBox");
const errorMsg = document.getElementById("errorMsg");

/* 🔐 protección diaria */
const exp = localStorage.getItem("access_exp");

if(!exp || Date.now() > Number(exp)){
  window.location.href = "../index.html";
}

function playStream(){
  errorMsg.textContent = "";

  if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src = STREAM;
    video.play()
      .then(()=> startBox.style.display = "none")
      .catch(()=> showError());
    return;
  }

  if(Hls.isSupported()){
    const hls = new Hls({
      enableWorker:true,
      lowLatencyMode:false
    });

    hls.loadSource(STREAM);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
      video.play()
        .then(()=> startBox.style.display = "none")
        .catch(()=> showError());
    });

    hls.on(Hls.Events.ERROR, ()=>{
      errorMsg.textContent = "Cargando transmisión...";
    });

    return;
  }

  showError();
}

function showError(){
  errorMsg.textContent = "No se pudo reproducir en este navegador de TV.";
}

startBtn.addEventListener("click", playStream);
</script>

</body>
</html>
