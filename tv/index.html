<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" href="/assets/faviconTop.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TopStreaming TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;}

body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
  color:white;
}

/* LOGIN */
.loginScreen{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at top left, rgba(16,185,129,0.25), transparent 40%),
    radial-gradient(circle at bottom right, rgba(59,130,246,0.25), transparent 40%),
    #020617;
}

.container{
  width:100%;
  max-width:420px;
  padding:32px 28px;
  border-radius:26px;
  background:rgba(10,15,25,0.45);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 30px 80px rgba(0,0,0,0.7);
  text-align:center;
}

.logo{
  width:170px;
  margin-bottom:12px;
}

h1{
  font-size:1.9rem;
  margin-bottom:6px;
}

p{
  color:#94a3b8;
  font-size:0.95rem;
}

.input{
  margin-top:22px;
  width:100%;
  padding:16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.04);
  color:white;
  text-align:center;
  font-size:1.35rem;
  letter-spacing:0.45em;
  outline:none;
}

.input:focus{
  border-color:#10b981;
  box-shadow:0 0 0 4px rgba(16,185,129,0.25);
}

.btn{
  margin-top:18px;
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,#10b981,#3b82f6);
  color:white;
  font-weight:700;
  cursor:pointer;
}

.msg{
  margin-top:12px;
  font-size:0.9rem;
  min-height:18px;
}

.error{color:#fb7185;}

/* TV PLAYER */
.tvScreen{
  display:none;
  width:100vw;
  height:100vh;
  background:#000;
  position:relative;
}

video{
  width:100vw;
  height:100vh;
  background:#000;
  object-fit:contain;
}

.startBox{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#000;
  z-index:10;
  text-align:center;
  padding:30px;
}

.startBtn{
  border:none;
  border-radius:18px;
  padding:18px 34px;
  font-size:22px;
  font-weight:700;
  color:white;
  cursor:pointer;
  background:linear-gradient(135deg,#ef4444,#991b1b);
  box-shadow:0 0 30px rgba(239,68,68,.35);
}

.errorMsg{
  margin-top:22px;
  color:#fca5a5;
  font-size:17px;
}
</style>
</head>

<body>

<section class="loginScreen" id="loginScreen">
  <div class="container">
    <img src="/assets/LogoTop.png" class="logo">

    <h1>Acceso TV</h1>
    <p>Ingresa la clave secreta de 6 dígitos</p>

    <form id="form">
      <input id="input" class="input" maxlength="6" placeholder="000000">
      <button class="btn">Acceder</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>
</section>

<section class="tvScreen" id="tvScreen">
  <video id="video" controls></video>

  <div class="startBox" id="startBox">
    <h1>TopStreaming TV</h1>
    <p>Presiona iniciar para ver la transmisión.</p>
    <button class="startBtn" id="startBtn">▶ Iniciar transmisión</button>
    <div class="errorMsg" id="errorMsg"></div>
  </div>
</section>

<script>
const MAX_ATTEMPTS = 10;
const ATTEMPTS_KEY = 'attempts_tv';
const ACCESS_KEY = 'access_exp';
const ACCESS_HOURS = 12;

const STREAM = "https://stream.mslatan.xyz/hls/stream.m3u8";

const loginScreen = document.getElementById("loginScreen");
const tvScreen = document.getElementById("tvScreen");
const video = document.getElementById("video");
const startBtn = document.getElementById("startBtn");
const startBox = document.getElementById("startBox");
const errorMsg = document.getElementById("errorMsg");

function peruNow(){
  return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Lima'}));
}

function generateCode(){
  const now = peruNow();
  const d = now.getDate();
  const m = now.getMonth()+1;
  const y = now.getFullYear();

  let val = Math.pow(d+m,2)*y;
  let code = String(val);

  if(code.length > 6) code = code.slice(0,6);
  if(code.length < 6) code = code.padEnd(6,'0');

  return code;
}

function getAttempts(){ return Number(localStorage.getItem(ATTEMPTS_KEY)||0); }
function setAttempts(v){ localStorage.setItem(ATTEMPTS_KEY,v); }
function resetAttempts(){ localStorage.removeItem(ATTEMPTS_KEY); }

function showTV(){
  loginScreen.style.display = "none";
  tvScreen.style.display = "block";
}

function grantAccess(){
  const exp = Date.now() + ACCESS_HOURS*3600000;
  localStorage.setItem(ACCESS_KEY, exp);
  showTV();
}

document.getElementById('form').addEventListener('submit', e=>{
  e.preventDefault();

  let attempts = getAttempts();
  const msg = document.getElementById('msg');

  if(attempts >= MAX_ATTEMPTS){
    msg.textContent = "Demasiados intentos. Intenta más tarde.";
    msg.classList.add('error');
    return;
  }

  const entered = document.getElementById('input').value.replace(/\D/g,'').slice(0,6);
  const expected = generateCode();

  if(entered === expected){
    resetAttempts();
    grantAccess();
  } else {
    attempts++;
    setAttempts(attempts);
    let left = MAX_ATTEMPTS - attempts;
    msg.textContent = `Clave incorrecta. Te quedan ${left} intentos`;
    msg.classList.add('error');
  }
});

document.getElementById('input').addEventListener('input', e=>{
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,6);
});

function playStream(){
  errorMsg.textContent = "";

  if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src = STREAM;
    video.play()
      .then(()=> startBox.style.display = "none")
      .catch(()=> showError());
    return;
  }

  if(Hls.isSupported()){
    const hls = new Hls();
    hls.loadSource(STREAM);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
      video.play()
        .then(()=> startBox.style.display = "none")
        .catch(()=> showError());
    });
    return;
  }

  showError();
}

function showError(){
  errorMsg.textContent = "No se pudo reproducir en este navegador de TV.";
}

startBtn.addEventListener("click", playStream);

if(Number(localStorage.getItem(ACCESS_KEY)||0) > Date.now()){
  showTV();
}
</script>

</body>
</html>
